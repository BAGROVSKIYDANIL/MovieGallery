<div
  class="flex min-h-80 flex-col items-center justify-center rounded-2xl border border-border bg-surface p-8 text-center"
  [attr.role]="kind() === 'error' ? 'alert' : 'status'"
>
  <div
    class="mb-6 flex h-16 w-16 items-center justify-center rounded-2xl border border-border bg-surface-raised text-accent"
  >
    <app-icon [name]="kind() === 'error' ? 'alert' : 'search'" class="scale-125" />
  </div>
  <h2 class="text-xl font-semibold text-paper">{{ title() }}</h2>
  <p class="mt-3 max-w-md text-sm leading-7 text-muted">{{ message() }}</p>
  @if (actionLabel()) {
    <button type="button" class="button-secondary mt-6" (click)="action.emit()">
      <app-icon [name]="kind() === 'error' ? 'refresh' : 'close'" />{{ actionLabel() }}
    </button>
  }
</div>
