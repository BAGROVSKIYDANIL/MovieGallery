@if (url(); as source) {
  @if (failedUrl() !== source) {
    <img
      [src]="source"
      [alt]="title() + ' poster'"
      [attr.loading]="priority() ? 'eager' : 'lazy'"
      width="500"
      height="750"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
      (error)="failedUrl.set(source)"
    />
  } @else {
    <ng-container [ngTemplateOutlet]="fallback" />
  }
} @else {
  <ng-container [ngTemplateOutlet]="fallback" />
}
<ng-template #fallback>
  <div
    class="flex h-full flex-col items-center justify-center gap-4 bg-gradient-to-br from-surface-raised to-surface p-5 text-center text-muted"
  >
    <app-icon name="film" class="scale-150 opacity-50" />
    <span class="text-xs tracking-wide">No poster available</span>
  </div>
</ng-template>
