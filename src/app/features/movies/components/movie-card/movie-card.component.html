<article class="h-full">
  <a
    [routerLink]="['/movie', movie().id]"
    class="group block h-full rounded-xl"
    [attr.aria-label]="'View ' + movie().title"
  >
    <div class="relative">
      <app-movie-poster [path]="movie().poster_path" [title]="movie().title" />
      <div
        class="absolute right-3 top-3 flex items-center gap-1.5 rounded-lg border border-white/10 bg-black/75 px-2.5 py-1.5 text-xs font-semibold text-white backdrop-blur-sm"
      >
        <app-icon name="star" class="text-accent [&_svg]:h-3.5 [&_svg]:w-3.5" />
        {{ movie().vote_count > 0 ? (movie().vote_average | number: '1.1-1') : 'NR' }}
      </div>
      <span
        class="absolute bottom-3 right-3 flex h-9 w-9 items-center justify-center rounded-full bg-accent text-black opacity-0 transition-all group-hover:opacity-100 group-focus-visible:opacity-100"
      ><app-icon name="next"
      /></span>
    </div>
    <div class="pt-4">
      <div
        class="mb-2 flex items-center justify-between gap-2 text-[11px] font-medium uppercase tracking-widest text-muted"
      >
            <span>{{ year() }}</span
            ><span>Movie</span>
      </div>
      <h3
        class="line-clamp-2 text-base font-semibold leading-snug text-paper transition-colors group-hover:text-accent"
      >
        {{ movie().title }}
      </h3>
      <p class="mt-2 line-clamp-2 text-xs leading-relaxed text-muted">
        {{ movie().overview || 'A new story waiting to be discovered.' }}
      </p>
    </div>
  </a>
</article>
