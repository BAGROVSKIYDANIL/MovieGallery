<div [attr.aria-busy]="loading()">
  @switch (state()) {
    @case ('loading') {
      <span class="sr-only" role="status">Loading movies</span>
      <div class="movie-grid" aria-hidden="true">
        @for (item of placeholders; track item) {
          <div>
            <div class="skeleton aspect-[2/3] rounded-xl"></div>
            <div class="skeleton mt-5 h-3 w-1/3 rounded"></div>
            <div class="skeleton mt-3 h-5 w-4/5 rounded"></div>
            <div class="skeleton mt-3 h-3 rounded"></div>
          </div>
        }
      </div>
    }
    @case ('error') {
      <app-status-panel
        kind="error"
        title="The intermission wasn’t planned"
        [message]="error() ?? ''"
        actionLabel="Try again"
        (action)="retried.emit()"
      />
    }
    @case ('empty') {
      <app-status-panel
        title="No movies found"
        message="Try another title or a shorter search."
        actionLabel="Explore popular movies"
        (action)="cleared.emit()"
      />
    }
    @case ('success') {
      <div class="movie-grid">
        @for (movie of movies(); track movie.id) {
          <app-movie-card [movie]="movie" />
        }
      </div>
    }
  }
</div>
